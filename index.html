<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Point and Click Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="game">

        <!--=======================-->
        <!--===  Thoughts Area  ===-->
        <!--=======================-->

        <div id="thoughts" class="thoughts">
            
            <span id="thought">
                No thoughts
            </span>

        </div>

        <!-- ========================= -->
        <!-- ROOM 1                     -->
        <!-- ========================= -->

        <div id="bedroom" class="room">

            <button id="cat" class="object"></button>

        </div>


        <!-- ========================= -->
        <!-- cat ZOOM                  -->
        <!-- ========================= -->

        <div id="catZoom" class="room hidden">

            <button id="backFromcat" class="backButton">
                ← Back
            </button>

            <button id="cat" class="object"></button>

        </div>


        <!-- ========================= -->
        <!-- ROOM 2                     -->
        <!-- ========================= -->

        <div id="room2" class="room hidden">

            <button id="backFromRoom2" class="backButton">
                ← Back
            </button>

            <button id="paper" class="object">
                Paper
            </button>

        </div>


        <!-- ========================= -->
        <!-- MESSAGE                    -->
        <!-- ========================= -->

        <div id="message">

            You are a strange room.

        </div>


        <!-- ========================= -->
        <!-- INVENTORY                  -->
        <!-- ========================= -->

        <div id="inventory">

            <strong>Inventory:</strong>

            <span id="inventoryItems">
                Empty
            </span>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
